function foodFiltered(){
 const q=queryParams();
 const search=($('#foodSearch')?.value||'').toLowerCase();
 const city=$('#foodCity')?.value||q.city||'All';
 const type=$('#foodType')?.value||'All';
 const saved=$('#savedOnly')?.checked;
 return DATA.restaurants.filter(r=>(city==='All'||r.city===city)&&
  (type==='All'||(type==='Vegan'?String(r.vegan).toLowerCase()==='yes':type==='Near hotel'?String(r.nearHotel).toLowerCase()==='yes':r.category===type))&&
  (!saved||state.favorites.includes(r.id))&&

function saveRating(id,n){state.ratings[id]=n;persist();closeModal();render()}window.saveRating=saveRating;

function render(){
 state.route=location.hash.slice(1)||'home';renderNav();
 const [path]=state.route.split('?'), parts=path.split('/'), base=parts[0];
 if(base==='home')renderHome();
 else if(base==='journey')renderJourney();
 else if(base==='city')renderCity(decodeURIComponent(parts.slice(1).join('/')));
 else if(base==='today')renderToday();
 else if(base==='food')renderFood();
 else if(base==='favorites')renderFavorites();
 else if(base==='wallet')renderWallet();
 else if(base==='readiness')renderReadiness();
 else if(base==='essentials')renderEssentials();
 else if(base==='shopping')renderShopping();

 window.scrollTo(0,0);
}

DATA.practical=[{"id": "money", "title": "Money, cards & ATMs", "summary": "Where cards work, cash backup and ATM plan.", "body": "Use no-FX-fee cards where possible. Keep a small cash reserve for temples, markets, lockers and smaller restaurants. In Japan, international cards commonly work at 7-Bank and Japan Post ATMs. In Korea, look for Global ATM signage. Decline dynamic currency conversion when offered."}, {"id": "transit", "title": "IC cards & transit", "summary": "Suica/PASMO and T-money basics.", "body": "Use a Japanese IC card for local trains, subways, buses and many convenience stores. For Seoul, load a T-money card. Long-distance reserved trains and airport transfers may still require separate tickets."}, {"id": "washrooms", "title": "Public washrooms", "summary": "Reliable places to find clean facilities.", "body": "Major stations, department stores, malls, museums, convenience stores with customer facilities and large attractions are the most dependable options. Carry a small hand towel because paper towels are not always provided."}, {"id": "charging", "title": "Charging & lockers", "summary": "Power banks, outlets and station lockers.", "body": "Carry a charged power bank. Coin lockers are common at major stations but fill quickly on weekends. Keep a digital photo of the locker location and number. Charging services may be available in malls, cafés and rental battery kiosks."}, {"id": "connectivity", "title": "eSIM & offline access", "summary": "Keep maps and confirmations available without signal.", "body": "Install and test eSIMs before departure, but activate data at arrival. Download Japan and Korea offline map areas, Japanese and Korean language packs, airline apps and every booking PDF."}, {"id": "weather", "title": "October weather & packing", "summary": "Layering for cities, Fuji and Hakone-area weather.", "body": "Pack light layers, a compact rain shell and comfortable walking shoes. Fuji-area mornings and evenings can be much colder than Osaka, Tokyo or Seoul. Keep one warm layer in the overnight bag."}, {"id": "veg", "title": "Vegetarian and egg-free checks", "summary": "Questions to ask about broth, sauces and egg.", "body": "Prioritize clearly vegan dishes for Riya. Verify dashi, bonito, fish sauce, meat stock, egg noodles, mayonnaise and hidden egg in bakery items. Save a translated dietary card offline."}, {"id": "health", "title": "Pharmacy & medical", "summary": "What to keep accessible and where to seek help.", "body": "Carry prescription medication in original packaging with a copy of the prescription. Search for drugstores near each basecamp and ask hotel reception for the closest clinic if needed. Keep insurance details offline."}, {"id": "emergency", "title": "Emergency contacts", "summary": "Core numbers and document backup.", "body": "Japan: police 110, ambulance/fire 119. South Korea: police 112, ambulance/fire 119. Keep passport copies, insurance, airline contacts and hotel addresses available offline."}, {"id": "etiquette", "title": "Local etiquette", "summary": "Transit, queues, rubbish and quiet spaces.", "body": "Queue neatly, keep calls quiet on transit, follow photography signs and carry small rubbish until a bin is available. Avoid eating while walking in crowded or sacred areas unless clearly permitted."}];

function foodFiltered(){const q=queryParams();const search=($('#foodSearch')?.value||'').toLowerCase();const city=$('#foodCity')?.value||q.city||'All';const type=$('#foodType')?.value||'All';const saved=$('#savedOnly')?.checked;const near=q.near==='1'||$('#nearOnly')?.checked;return DATA.restaurants.filter(r=>(city==='All'||r.city===city)&&(type==='All'||(type==='Vegan'?String(r.vegan).toLowerCase()==='yes':type==='Near hotel'?String(r.nearHotel).toLowerCase()==='yes':r.category===type))&&(!saved||state.favorites.includes(r.id))&&(!near||String(r.nearHotel).toLowerCase()==='yes')&&(!search||[r.name,r.zone,r.category,r.mustTry,r.why].join(' ').toLowerCase().includes(search)))}

function shopArticles(x){
 const direct=SHOP_ARTICLES[x.id]; if(direct)return direct;
 const raw=(x.buy||'').split(/[,;•]/).map(v=>v.trim()).filter(Boolean);
 return raw.length?raw:[];
}
function shopKey(shopId,i){return shopId+'::'+i}
function toggleShopItem(shopId,i,v){state.shoppingChecks[shopKey(shopId,i)]=v;persist();render()}
function shopProgress(x){const a=shopArticles(x);return [a.filter((_,i)=>state.shoppingChecks[shopKey(x.id,i)]).length,a.length]}

// Override shopping pages with real persistent checklists
renderShopping=function(){const q=queryParams(),city=q.city||'All';setHeader('Shopping checklists');const cities=['All',...new Set(DATA.shopping.map(x=>x.city))];const items=city==='All'?DATA.shopping:DATA.shopping.filter(x=>x.city===city);$('#view').innerHTML=`<div class="page-title"><div><h1>Shopping Checklists</h1><p>Open a store and tick each article as you buy it. Checkmarks stay saved on this device.</p></div></div><div class="chips">${cities.map(x=>`<button class="chip ${city===x?'active':''}" onclick="go('shopping${x==='All'?'':'?city='+encodeURIComponent(x)}')">${esc(x)}</button>`).join('')}</div><div class="list">${items.map(x=>{const [done,total]=shopProgress(x);return `<div class="row card click" onclick="go('shop/${x.id}')"><div class="row-main"><span class="kicker">${esc(x.city)} · ${esc(x.category)}</span><b>${esc(x.name)}</b><small>${esc(x.area)}${total?` · ${done}/${total} bought`:''}</small></div><b>›</b></div>`}).join('')}</div>`}
renderShop=function(id){const x=DATA.shopping.find(s=>s.id===id);if(!x)return go('shopping');const articles=shopArticles(x),[done,total]=shopProgress(x);setHeader(x.city+' Shopping');$('#view').innerHTML=`<div class="page-title"><div><span class="kicker">${esc(x.city)} · ${esc(x.category)}</span><h1>${esc(x.name)}</h1><p>${esc(x.area)}${total?` · ${done}/${total} Bought`:''}</p></div></div><div class="detail-grid"><div class="detail-item"><small>Location / Address</small><b>${esc(x.address)}</b></div><div class="detail-item"><small>Tax-Free Note</small><b>${esc(x.tax)}</b></div></div>${articles.length?`<section class="section"><div class="section-head"><h2>Shopping Checklist</h2><span class="badge">${done}/${total}</span></div><div class="list">${articles.map((a,i)=>`<label class="row"><input class="check" type="checkbox" ${state.shoppingChecks[shopKey(x.id,i)]?'checked':''} onchange="toggleShopItem('${x.id}',${i},this.checked)"><div class="row-main"><b>${esc(a)}</b><small>${state.shoppingChecks[shopKey(x.id,i)]?'Bought ✓':'To Buy'}</small></div></label>`).join('')}</div></section>`:`<div class="notice">No Specific Article Has Been Assigned To This Store Yet.</div>`}<section class="section"><div class="card"><h3>Store Notes</h3><p>${esc(x.why)}</p><div class="actions"><button class="btn primary" onclick="window.open('${x.fromHotel}','_blank')">Directions From Basecamp</button><button class="btn" onclick="window.open('${x.maps}','_blank')">Open In Maps</button></div></div></section>`};

<style>

<script>
(function(){
const HOME18="locked-home-v18.png";
const JAPAN18="locked-japan-hub-v18.png";

/* ---------- Shared master wallet ---------- */
const W18={
 rates:store.get("v18_fx",{JPY:108,KRW:1020,USD:0.712}),
 cash:()=>store.get("v18_cash",{JPY:70000,KRW:200000}),
 setCash:v=>store.set("v18_cash",v),
 tx:()=>store.get("v18_tx",[]),
 setTx:v=>store.set("v18_tx",v)
};
function cad18(a,c){a=Number(a)||0;if(c==="CAD")return a;if(c==="JPY")return a/W18.rates.JPY;if(c==="KRW")return a/W18.rates.KRW;if(c==="USD")return a/W18.rates.USD;return 0}
function baseCAD18(){return state.expenses.reduce((s,e)=>s+Number(e.amount||0),0)}
function totalCAD18(){return baseCAD18()+W18.tx().reduce((s,e)=>s+Number(e.cad||0),0)}
function seed18(){
 let x=W18.tx(),has=id=>x.some(e=>e.id===id);
 if(!has("bus"))x.push({id:"bus",date:"2026-10-12",amount:8000,currency:"JPY",cad:cad18(8000,"JPY"),payment:"Card",country:"Japan",category:"Transport",note:"Kaneyamaen bus transfer"});
 if(!has("hp"))x.push({id:"hp",date:"2026-10-17",amount:14600,currency:"JPY",cad:cad18(14600,"JPY"),payment:"Card",country:"Japan",category:"Attraction",note:"Harry Potter Studio Tour · 10:00"});
 if(!has("nrtjpy"))x.push({id:"nrtjpy",date:"2026-10-21",amount:16110,currency:"JPY",cad:cad18(16110,"JPY"),payment:"Card",country:"Japan",category:"Flight",note:"Tokyo → Seoul flight · JPY component"});
 if(!has("nrtusd"))x.push({id:"nrtusd",date:"2026-10-21",amount:192.70,currency:"USD",cad:cad18(192.70,"USD"),payment:"Card",country:"Japan",category:"Flight",note:"Tokyo → Seoul flight · USD component · +12,500 miles"});
 W18.setTx(x)
}
seed18();

   hotspots so code changes cannot drift its typography, sizing or artwork. */

   <button class="v18-hot" style="left:36%;top:92.2%;width:16%;height:7%" onclick="go('food')" aria-label="Food"></button>
   <button class="v18-hot" style="left:54%;top:92.2%;width:16%;height:7%" onclick="go('wallet')" aria-label="Wallet"></button>
   <button class="v18-hot" style="left:72%;top:92.2%;width:16%;height:7%" onclick="go('readiness')" aria-label="Ready"></button>
 </div>`;

}

 setHeader("Seoul · Oct 21–25");
 const c=W18.cash();
 $("#view").innerHTML=`<div class="page-title"><div><div class="kicker">SOUTH KOREA · 대한민국</div><h1>Seoul</h1><p>Oct 21–25, 2026</p></div></div>
 <div class="v18-country-grid">

 </div>`;
}

/* ---------- Master Travel Wallet: same system for Japan + Seoul ---------- */
function renderWallet18(){
 document.body.classList.remove("v18-home-shell");
 setHeader("Travel Wallet");
 const c=W18.cash(),tx=W18.tx();
 const q=new URLSearchParams((state.route.split("?")[1]||"")),filter=q.get("country");
 const rows=filter?tx.filter(e=>e.country===filter):tx;
 $("#view").innerHTML=`<div class="page-title"><div><h1>${filter==="Japan"?"Japan Cash & Expenses":filter==="Seoul"?"Korea Cash & Expenses":"Travel Wallet"}</h1><p>One shared wallet · CAD master reporting · original currency retained.</p></div></div>
 <div class="v18-money-grid">
  <div class="v18-money"><small>Japan cash</small><b>¥${Number(c.JPY||0).toLocaleString()}</b><small>JPY wallet</small></div>
  <div class="v18-money"><small>Korea cash</small><b>₩${Number(c.KRW||0).toLocaleString()}</b><small>KRW wallet</small></div>
 </div>
 <section class="section"><div class="grid"><div class="card metric"><b>${money(totalCAD18())}</b><span>Master CAD trip spend</span></div><div class="card metric"><b>${tx.length}</b><span>Multi-currency entries</span></div></div></section>
 <section class="section"><div class="actions"><button class="btn primary" onclick="V18.expense()">＋ Add expense</button><button class="btn soft" onclick="V18.loadCash()">＋ Load cash</button><button class="btn" onclick="V18.fx()">Exchange rates</button></div></section>
 <div class="notice">Loading/exchanging physical cash changes the cash balance but is not counted as spending. Cash purchases reduce the relevant cash wallet automatically.</div>
 <section class="section"><div class="section-head"><h2>${filter?filter+" transactions":"All multi-currency transactions"}</h2></div><div class="list">${[...rows].reverse().map(e=>`<div class="row"><div class="row-main"><b>${esc(e.note)}</b><small>${esc(e.date||"")} · ${esc(e.country||"Trip")} · ${esc(e.payment||"")} · ${Number(e.amount).toLocaleString()} ${esc(e.currency)}</small></div><b>${money(e.cad)}</b></div>`).join("")||'<div class="empty">No transactions yet.</div>'}</div></section>`
}
function expense18(){
 $("#modalTitle").textContent="Add expense";
 $("#modalBody").innerHTML=`<form class="v18-form" id="v18expense">
 <label>Amount<input name="amount" type="number" step="0.01" required></label>
 <label>Currency<select name="currency"><option>JPY</option><option>KRW</option><option>CAD</option><option>USD</option></select></label>
 <label>Country<select name="country"><option>Japan</option><option>Seoul</option><option>Trip</option></select></label>
 <label>Payment<select name="payment"><option>Cash</option><option>Card</option><option>Points / Miles</option></select></label>
 <label>Category<select name="category"><option>Food</option><option>Shopping</option><option>Transport</option><option>Attraction</option><option>Hotel</option><option>Other</option></select></label>
 <label>Note<input name="note"></label><label>Date<input name="date" type="date"></label><button class="btn primary">Save</button></form>`;
 $("#modal").classList.add("show");
 $("#v18expense").onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));let x=W18.tx();x.push({...f,id:"v18_"+Date.now(),amount:Number(f.amount),cad:cad18(f.amount,f.currency)});W18.setTx(x);if(f.payment==="Cash"&&(f.currency==="JPY"||f.currency==="KRW")){let c=W18.cash();c[f.currency]=Math.max(0,Number(c[f.currency]||0)-Number(f.amount));W18.setCash(c)}closeModal();renderWallet18()}
}
function loadCash18(){
 $("#modalTitle").textContent="Load cash wallet";
 $("#modalBody").innerHTML=`<form class="v18-form" id="v18cash"><label>Wallet<select name="currency"><option value="JPY">Japan · JPY</option><option value="KRW">Korea · KRW</option></select></label><label>Amount<input name="amount" type="number" required></label><button class="btn primary">Add to wallet</button></form>`;
 $("#modal").classList.add("show");
 $("#v18cash").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),c=W18.cash(),k=f.get("currency");c[k]=Number(c[k]||0)+Number(f.get("amount"));W18.setCash(c);closeModal();renderWallet18()}
}
function fx18(){
 $("#modalTitle").textContent="Exchange rates";
 $("#modalBody").innerHTML=`<form class="v18-form" id="v18fx"><label>JPY per C$1<input name="JPY" type="number" step=".01" value="${W18.rates.JPY}"></label><label>KRW per C$1<input name="KRW" type="number" step=".01" value="${W18.rates.KRW}"></label><label>USD per C$1<input name="USD" type="number" step=".0001" value="${W18.rates.USD}"></label><button class="btn primary">Save</button></form>`;
 $("#modal").classList.add("show");
 $("#v18fx").onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));W18.rates={JPY:Number(f.JPY),KRW:Number(f.KRW),USD:Number(f.USD)};store.set("v18_fx",W18.rates);W18.setTx(W18.tx().map(x=>({...x,cad:cad18(x.amount,x.currency)})));closeModal();renderWallet18()}
}

/* ---------- Router override ---------- */
const render17=render;
render=function(){
 state.route=location.hash.slice(1)||"home";
 const base=state.route.split("?")[0].split("/")[0];
 if(base==="home"){renderNav();renderHome18();return}
 if(base==="japanhub"){renderNav();renderJapan18();return}
 if(base==="seoulhub"){renderNav();renderSeoul18();return}
 if(base==="wallet"){renderNav();renderWallet18();window.scrollTo(0,0);return}
 document.body.classList.remove("v18-home-shell");
 return render17()
};
window.onhashchange=render;
window.V18={expense:expense18,loadCash:loadCash18,fx:fx18};
document.documentElement.dataset.build="v18-locked-ui-2026-09-21";
setTimeout(render,20);
})();
</script>
